apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: id-system-ingress
  namespace: id-system
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: idgen.local     # or any domain
      http:
        paths:
          - path: /coordinator
            pathType: Prefix
            backend:
              service:
                name: coordinator-service
                port:
                  number: 5000
          - path: /idgen
            pathType: Prefix
            backend:
              service:
                name: id-service
                port:
                  number: 8000
