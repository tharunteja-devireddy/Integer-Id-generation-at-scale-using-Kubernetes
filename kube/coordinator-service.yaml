apiVersion: v1
kind: Service
metadata:
  name: coordinator-service
  namespace: id-system
spec:
  selector:
    app: coordinator-service
    role: active  # Ensures traffic only goes to the active pod
  ports:
    - protocol: TCP
      port: 5000         # The service port
      targetPort: 5000   # The container port
  type: LoadBalancer
