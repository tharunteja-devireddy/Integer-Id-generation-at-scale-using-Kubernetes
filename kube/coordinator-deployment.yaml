apiVersion: apps/v1
kind: Deployment
metadata:
  name: coordinator-service
  namespace: id-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: coordinator-service
  template:
    metadata:
      labels:
        app: coordinator-service
    spec:
      containers:
        - name: coordinator-service
          image: localhost:5001/coordinator-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: coordinator-service
  namespace: id-system
spec:
  selector:
    app: coordinator-service
  ports:
    - protocol: TCP
      port: 5000         # The service port
      targetPort: 5000   # The container port
  type: LoadBalancer
