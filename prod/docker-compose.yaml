
services:

  # Redis for storing ID pool and heartbeats
  redis:
    image: redis:latest
    container_name: redis_container
    ports:
      - "6379:6379"
    restart: always

  # Load Balancer (NGINX)
  nginx:
    image: nginx:latest
    container_name: nginx_lb
    ports:
      - "8000:8000"
      - "5000:5000"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - coordinator-service-1
      - coordinator-service-2
      - id-service-1
      - id-service-2
      - id-service-3
      - id-service-4

  # Coordinator Services (2 Instances)
  coordinator-service-1:
    build: ../coordinator-service
    container_name: coordinator-service-1
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379

  coordinator-service-2:
    build: ../coordinator-service
    container_name: coordinator-service-2
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379

  # ID Services (4 Instances)
  id-service-1:
    build: ../id-service
    container_name: id-service-1
    depends_on:
      - coordinator-service-1
      - coordinator-service-2
    environment:
      - COORDINATOR_URL=http://coordinator-service-1:5000

  id-service-2:
    build: ../id-service
    container_name: id-service-2
    depends_on:
      - coordinator-service-1
      - coordinator-service-2
    environment:
      - COORDINATOR_URL=http://coordinator-service-2:5000

  id-service-3:
    build: ../id-service
    container_name: id-service-3
    depends_on:
      - coordinator-service-1
      - coordinator-service-2
    environment:
      - COORDINATOR_URL=http://coordinator-service-1:5000

  id-service-4:
    build: ../id-service
    container_name: id-service-4
    depends_on:
      - coordinator-service-1
      - coordinator-service-2
    environment:
      - COORDINATOR_URL=http://coordinator-service-2:5000
